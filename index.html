<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d97757">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Idées">
  <title>Idées Claude</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Idées Claude</h1>
      <span id="count" class="muted"></span>
    </header>
    <button type="button" id="car-open" class="car-open">🚗 Mode voiture</button>

    <form id="form" autocomplete="off">
      <input id="project" list="projects" placeholder="Projet (ex. Claude reminders)" maxlength="60" aria-label="Projet">
      <datalist id="projects"></datalist>
      <textarea id="text" rows="3" placeholder="Une idée, une tâche, une question…" aria-label="Idée" required></textarea>
      <div class="row">
        <button type="button" id="mic" class="ghost" aria-label="Dicter" hidden>🎤 Dicter</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
    </form>

    <input id="search" type="search" placeholder="Rechercher…" aria-label="Rechercher">
    <div id="chips" class="chips" role="tablist"></div>

    <ul id="list"></ul>
    <p id="empty" class="muted" hidden>Aucune idée pour l’instant. Notez la première ci-dessus.</p>

    <details id="sync" class="sync">
      <summary id="sync-summary">Synchro</summary>
      <input id="sync-url" type="url" inputmode="url" placeholder="Adresse du script Google (…/exec)" aria-label="Adresse du script">
      <input id="sync-secret" type="password" autocomplete="off" placeholder="Code secret" aria-label="Code secret">
      <div class="row">
        <button type="button" id="sync-save" class="ghost">Enregistrer</button>
        <button type="button" id="sync-now" class="primary">Synchroniser</button>
      </div>
      <p id="sync-status" class="muted small"></p>
    </details>

    <footer>
      <button type="button" id="copy" class="ghost">Copier (Markdown)</button>
      <button type="button" id="export" class="ghost">Exporter</button>
      <label class="ghost button">Importer<input id="import" type="file" accept="application/json" hidden></label>
    </footer>
    <p class="muted small">Les notes restent sur cet appareil (stockage du navigateur). Pensez à exporter de temps en temps.</p>
  </main>
  <div id="car" class="car" data-state="idle" hidden>
    <div class="car-top">
      <button type="button" id="car-close" class="ghost">✕ Quitter</button>
      <select id="car-project" aria-label="Projet"></select>
    </div>
    <button type="button" id="car-btn" class="car-btn">
      <span id="car-icon" class="car-icon" aria-hidden="true">🎤</span>
      <span id="car-label" class="car-label"></span>
    </button>
    <p id="car-text" class="car-text" role="status" aria-live="polite"></p>
    <button type="button" id="car-undo" class="car-undo" hidden>↩ Annuler cette idée</button>
    <label class="car-voice"><input type="checkbox" id="car-voice" checked> Réponse vocale « Enregistré »</label>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
